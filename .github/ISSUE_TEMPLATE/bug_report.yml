name: Bug report
description: Report a problem with genre-review
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Messages or log output
      description: The message shown on the page, or `docker compose logs`. Remove your Last.fm API key and MPD password first.
      render: text
  - type: input
    id: version
    attributes:
      label: Image tag or commit
      placeholder: ghcr.io/bonelifer/genre-review:latest
